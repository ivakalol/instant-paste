name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Настройка на Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Инсталиране на зависимости и Build на React
        run: |
          cd client
          npm ci
          npm run build
          cd ..

      - name: Подготовка на деплой пакета
        run: |
          mkdir -p release/client
          # Копиране на бекенд файловете от корена
          cp server.js release/
          cp package.json release/
          cp package-lock.json release/ 2>/dev/null || true
          # Копиране на компилирания React фронтенд на точния път
          cp -r client/build release/client/build

      - name: Публикуване в deploy бранч
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release
          branch: deploy